<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ .Site.Title }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<!-- Display face: General Sans (geometric grotesque substitute for PP Mori). Body: Inter. Code only: JetBrains Mono. -->
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  /* Getclockwise style system — light theme only.
     Existing Tailwind palette names are remapped onto the design tokens so
     every template and JS-rendered component inherits the new style. */
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'sans-serif'],
          serif: ['"PP Mori"', '"General Sans"', '"DM Serif Display"', 'Georgia', 'serif'],
          display: ['"PP Mori"', '"General Sans"', '"DM Serif Display"', 'Georgia', 'serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
        colors: {
          /* tokens */
          'forest-ink': '#003f2e',
          'vivid-emerald': '#039861',
          'cream-canvas': '#fdf9f7',
          'pure-paper': '#ffffff',
          'ink-black': '#333333',
          'faded-pencil': '#6e7673',
          'hairline-gray': '#d6d6d6',
          'mid-gray': '#a6a6a6',
          /* neutral remap: headings -> forest ink, body -> ink black, muted -> faded pencil, borders -> hairline */
          slate: {
            50: '#fdf9f7', 100: '#f6f1ed', 200: '#d6d6d6', 300: '#d6d6d6', 400: '#a6a6a6',
            500: '#6e7673', 600: '#6e7673', 700: '#333333', 800: '#333333', 900: '#003f2e', 950: '#003f2e',
          },
          stone: { 50: '#fdf9f7', 100: '#f6f1ed', 200: '#ece6e1' },
          /* former amber accent -> forest ink (text) / vivid emerald (rules, borders) */
          amber: {
            50: '#f1f8f4', 100: '#e3f1e9', 200: '#c3e3d2', 300: '#039861', 400: '#039861',
            450: '#039861', 500: '#039861', 600: '#003f2e', 700: '#003f2e', 800: '#003f2e', 900: '#003f2e',
          },
          emerald: {
            300: '#039861', 400: '#039861', 500: '#039861', 600: '#003f2e', 700: '#003f2e',
          },
          obsidian: { 950: '#003f2e', 900: '#003f2e', 800: '#003f2e', 700: '#003f2e' },
        }
      }
    }
  }
</script>
<style>
  :root {
    /* Colors */
    --color-forest-ink: #003f2e;
    --color-vivid-emerald: #039861;
    --color-cream-canvas: #fdf9f7;
    --color-pure-paper: #ffffff;
    --color-ink-black: #333333;
    --color-faded-pencil: #6e7673;
    --color-hairline-gray: #d6d6d6;
    --color-mid-gray: #a6a6a6;

    /* Font families */
    --font-pp-mori: 'PP Mori', 'General Sans', 'DM Serif Display', Georgia, serif;
    --font-inter: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    /* Type scale */
    --text-body: 16px;        --leading-body: 1.4;        --tracking-body: -0.48px;
    --text-body-lg: 18px;     --leading-body-lg: 1.4;     --tracking-body-lg: -0.54px;
    --text-subheading: 20px;  --leading-subheading: 1.3;  --tracking-subheading: -0.6px;
    --text-heading-sm: 24px;  --leading-heading-sm: 1.3;  --tracking-heading-sm: -0.72px;
    --text-heading: 52px;     --leading-heading: 1;
    --text-heading-lg: 64px;  --leading-heading-lg: 1;
    --text-display: 66px;     --leading-display: 0.95;

    /* Spacing */
    --spacing-4: 4px; --spacing-8: 8px; --spacing-20: 20px; --spacing-32: 32px;
    --spacing-40: 40px; --spacing-48: 48px; --spacing-64: 64px; --spacing-80: 80px;
    --spacing-96: 96px; --spacing-180: 180px;

    /* Layout */
    --page-max-width: 1200px;
    --section-gap: 64px;
    --element-gap: 20px;

    /* Radii */
    --radius-full: 800px;
    --radius-tags: 800px;
    --radius-cards: 0px;
    --radius-logos: 800px;
    --radius-buttons: 800px;
  }

  /* ---------- Canvas & base type ---------- */
  html, body { background: var(--color-cream-canvas) !important; }
  body {
    font-family: var(--font-inter);
    color: var(--color-ink-black);
    font-size: var(--text-body);
    line-height: var(--leading-body);
    letter-spacing: -0.03em;
  }
  ::selection { background: #c3e3d2; color: var(--color-forest-ink); }

  /* Page container: 1200px max */
  .max-w-7xl { max-width: var(--page-max-width) !important; }

  /* ---------- Headings: display face, forest ink, compact leading ---------- */
  h1, h2, h3, .font-serif {
    font-family: var(--font-pp-mori) !important;
    font-weight: 600;
    color: var(--color-forest-ink);
    letter-spacing: 0;
    font-style: normal !important;
  }
  h1 { line-height: var(--leading-display) !important; }
  h2 { line-height: var(--leading-heading) !important; }
  h3 { line-height: 1.2 !important; }
  h4, h5, h6 { font-family: var(--font-inter); font-weight: 700; color: var(--color-forest-ink); letter-spacing: -0.03em; }
  .text-5xl, .text-6xl { font-size: clamp(40px, 6vw, var(--text-display)) !important; line-height: var(--leading-display) !important; }
  .text-4xl { font-size: clamp(36px, 5vw, var(--text-heading)) !important; line-height: 1 !important; }

  /* Monospace kept for code only; UI labels become Inter */
  .font-mono:not(pre):not(code) { font-family: var(--font-inter) !important; letter-spacing: -0.03em; }
  pre, code, pre *, code * { font-family: 'JetBrains Mono', monospace !important; letter-spacing: 0; }
  .uppercase { letter-spacing: 0.02em; }

  /* Editorial body copy */
  .prose-editorial p, main article p { max-width: 640px; font-size: var(--text-body-lg); line-height: var(--leading-body-lg); }

  /* ---------- Flat, paper-like: no shadows, gradients, blur tints ---------- */
  *, *::before, *::after { box-shadow: none !important; text-shadow: none !important; }
  [class*="bg-gradient"] { background-image: none !important; }

  /* ---------- Shapes: cards square, interactive elements capsule ---------- */
  .rounded, .rounded-md, .rounded-lg, .rounded-xl, .rounded-2xl, .rounded-3xl { border-radius: var(--radius-cards) !important; }
  button, button[class], select, select[class], input[type="search"], input[type="text"][class], .rounded-full,
  a.rounded, a.rounded-lg, a.rounded-xl, span.rounded, span.rounded-lg, span.rounded-md {
    border-radius: var(--radius-buttons) !important;
  }
  /* Logo monogram */
  header .w-9.h-9 { border-radius: var(--radius-logos) !important; }
  /* Cards sit on pure paper with hairline borders */
  .bg-white { background-color: var(--color-pure-paper) !important; }
  .border-slate-200, .border-slate-300 { border-color: var(--color-hairline-gray) !important; }

  /* ---------- Buttons: ghost / outlined only, never filled ---------- */
  button {
    background-color: transparent !important;
    border: 1px solid var(--color-hairline-gray);
    color: var(--color-forest-ink);
    font-family: var(--font-inter) !important;
    font-weight: 500;
    transition: border-color .15s, color .15s;
  }
  button:hover { border-color: var(--color-vivid-emerald) !important; color: var(--color-forest-ink) !important; }
  /* Former filled / active states become emerald outline */
  button[class*="bg-amber-500"], button[class*="bg-slate-900"], button[class*="bg-emerald-500"],
  .nav-btn[class*="border-amber"], .cat-btn[class*="bg-amber-500"] {
    border: 1px solid var(--color-vivid-emerald) !important;
    color: var(--color-forest-ink) !important;
  }
  .bg-amber-500, .bg-slate-900 { background-color: transparent !important; color: var(--color-forest-ink) !important; border: 1px solid var(--color-forest-ink); }
  /* Progress bars keep a thin emerald fill (rule, not a surface) */
  .h-full.bg-amber-500, .h-full.bg-emerald-500 { background-color: var(--color-vivid-emerald) !important; border: 0; }
  /* Tinted surfaces flattened to paper/cream */
  [class*="bg-amber-500/"], [class*="bg-emerald-500/"] { background-color: transparent !important; }

  /* ---------- Links: ghost link with emerald underline rule ---------- */
  main p a, main li a, .prose a {
    color: var(--color-vivid-emerald);
    font-weight: 500;
    text-decoration: none;
    border-bottom: 1px solid var(--color-vivid-emerald);
  }
  main p a:hover, main li a:hover { color: var(--color-forest-ink); border-color: var(--color-forest-ink); }

  /* ---------- Pills / badges ---------- */
  .rounded-full.border, span.rounded.border, span.rounded-md.border {
    border-color: var(--color-forest-ink) !important;
    color: var(--color-forest-ink) !important;
    background: transparent !important;
  }

  /* ---------- Dividers ---------- */
  hr { border: 0; border-top: 1px solid var(--color-hairline-gray); margin: var(--spacing-48) 0; }
  hr.rule-emphasis { border-top-color: var(--color-vivid-emerald); }

  /* ---------- FAQ accordion (details/summary) ---------- */
  details { border-top: 1px solid var(--color-hairline-gray); padding: var(--spacing-20) 0; }
  details > summary { font-weight: 700; color: var(--color-forest-ink); cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: var(--spacing-20); }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after {
    content: '+'; flex: none; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--color-forest-ink); border-radius: var(--radius-full); font-weight: 400;
  }
  details[open] > summary::after { content: '\2212'; }

  /* Header bar: cream, hairline */
  header.sticky { background: rgba(253, 249, 247, 0.96) !important; border-color: var(--color-hairline-gray) !important; }

  /* Footer: Forest Ink surface (level 2), inverted text */
  .site-footer { background: var(--color-forest-ink); color: var(--color-cream-canvas); }
  .site-footer .footer-wordmark { font-family: var(--font-pp-mori); font-weight: 600; font-size: var(--text-heading-sm); line-height: 1.1; letter-spacing: 0; }
  .site-footer .footer-muted { color: rgba(253, 249, 247, 0.7); }
  .site-footer nav a { color: var(--color-cream-canvas); font-weight: 500; text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 2px; transition: border-color .15s; }
  .site-footer nav a:hover { border-bottom-color: var(--color-cream-canvas); }
  .site-footer .footer-rule { border-top: 1px solid rgba(253, 249, 247, 0.2); }

  /* Form accents */
  input[type="checkbox"] { accent-color: var(--color-vivid-emerald); }
</style>
