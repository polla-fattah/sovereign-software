<!-- Primary Navigation Header -->
<header class="sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800/90 bg-stone-50/90 dark:bg-obsidian-950/90 backdrop-blur-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-8 h-16 flex items-center justify-between">
    <a href="{{ .Site.Home.RelPermalink }}" class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-lg bg-slate-900 dark:bg-amber-500 flex items-center justify-center text-white dark:text-obsidian-950 font-mono font-bold text-lg shadow-sm">§</div>
      <div>
        <span class="font-mono text-sm font-bold tracking-wider uppercase block leading-none">Sovereign.Software</span>
      </div>
    </a>

    <nav class="hidden lg:flex items-center space-x-1 font-mono text-xs">
      <a href="{{ "manifesto/" | relURL }}" class="nav-btn px-3.5 py-2 rounded-lg font-medium border {{ if hasPrefix $.RelPermalink ("manifesto/" | relURL) }}bg-amber-500/15 text-amber-600 border-amber-500/30{{ else }}text-slate-600 hover:text-slate-900 border-transparent{{ end }}">The Manifesto</a>
      <a href="{{ "directory/" | relURL }}" class="nav-btn px-3.5 py-2 rounded-lg font-medium border {{ if hasPrefix $.RelPermalink ("directory/" | relURL) }}bg-amber-500/15 text-amber-600 border-amber-500/30{{ else }}text-slate-600 hover:text-slate-900 border-transparent{{ end }}">Sovereign Index</a>
      <a href="{{ "evaluator/" | relURL }}" class="nav-btn px-3.5 py-2 rounded-lg font-medium border {{ if hasPrefix $.RelPermalink ("evaluator/" | relURL) }}bg-amber-500/15 text-amber-600 border-amber-500/30{{ else }}text-slate-600 hover:text-slate-900 border-transparent{{ end }}">Evaluator</a>
      <a href="{{ "methodology/" | relURL }}" class="nav-btn px-3.5 py-2 rounded-lg font-medium border {{ if hasPrefix $.RelPermalink ("methodology/" | relURL) }}bg-amber-500/15 text-amber-600 border-amber-500/30{{ else }}text-slate-600 hover:text-slate-900 border-transparent{{ end }}">Methodology</a>
      <a href="{{ "escape-hatches/" | relURL }}" class="nav-btn px-3.5 py-2 rounded-lg font-medium border {{ if hasPrefix $.RelPermalink ("escape-hatches/" | relURL) }}bg-amber-500/15 text-amber-600 border-amber-500/30{{ else }}text-slate-600 hover:text-slate-900 border-transparent{{ end }}">Escape Hatches</a>
    </nav>

    <a href="{{ "read/sovereign-personal-software-manifesto.md" | relURL }}" download="sovereign-personal-software-manifesto.md" title="Download the full manifesto as Markdown" class="btn-ghost rounded hidden lg:inline-flex items-center gap-1.5 px-4 py-2 text-xs">↓ .MD</a>

    {{ with .Site.Params.social.githubRepo }}
    <a href="{{ . }}" target="_blank" rel="noopener" aria-label="View source on GitHub" title="View source on GitHub" class="github-link hidden lg:inline-flex">
      {{ partial "github-icon.html" "w-5 h-5" }}
    </a>
    {{ end }}

    <div class="lg:hidden flex items-center">
      <select onchange="location.href=this.value" id="mobile-nav-select" aria-label="Section navigation" class="bg-white dark:bg-obsidian-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 font-mono text-xs text-slate-800 dark:text-slate-100">
        <option value="{{ "manifesto/" | relURL }}"{{ if hasPrefix $.RelPermalink ("manifesto/" | relURL) }} selected{{ end }}>The Manifesto</option>
        <option value="{{ "directory/" | relURL }}"{{ if hasPrefix $.RelPermalink ("directory/" | relURL) }} selected{{ end }}>Sovereign Index</option>
        <option value="{{ "evaluator/" | relURL }}"{{ if hasPrefix $.RelPermalink ("evaluator/" | relURL) }} selected{{ end }}>Evaluator</option>
        <option value="{{ "methodology/" | relURL }}"{{ if hasPrefix $.RelPermalink ("methodology/" | relURL) }} selected{{ end }}>Methodology</option>
        <option value="{{ "escape-hatches/" | relURL }}"{{ if hasPrefix $.RelPermalink ("escape-hatches/" | relURL) }} selected{{ end }}>Escape Hatches</option>
      </select>
      <a href="{{ "read/sovereign-personal-software-manifesto.md" | relURL }}" download="sovereign-personal-software-manifesto.md" aria-label="Download the full manifesto as Markdown" class="btn-ghost rounded ml-2 px-3 py-1.5 text-xs">↓ .MD</a>
    </div>
  </div>
</header>

<div id="toast" class="fixed bottom-6 right-6 z-50 hidden transform transition-all duration-300 bg-slate-900 dark:bg-amber-500 text-white dark:text-obsidian-950 font-mono text-xs font-semibold px-4 py-3 rounded-lg shadow-xl border border-slate-700 dark:border-amber-400 flex items-center gap-2">
  <span>✓</span>
  <span id="toast-message">Copied to clipboard</span>
</div>
