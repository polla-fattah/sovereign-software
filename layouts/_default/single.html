{{ define "main" }}
<article class="max-w-4xl mx-auto rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-obsidian-900 p-6 sm:p-12 space-y-6">
  <div class="font-mono text-xs text-amber-500 uppercase tracking-widest">Standalone Hugo Page</div>
  <h1 class="font-serif text-4xl sm:text-5xl text-slate-900 dark:text-white">{{ .Title }}</h1>
  <div class="prose dark:prose-invert max-w-none text-slate-600 dark:text-slate-300 leading-relaxed space-y-4">
    {{ .Content }}
  </div>
</article>
{{ end }}
