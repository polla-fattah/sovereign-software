{{ define "main" }}
<article class="reading">
  <div class="no-print flex flex-wrap gap-4 font-mono text-xs pb-6">
    <a href="#" onclick="window.print(); return false;">⎙ Print / save as PDF</a>
    {{ with .OutputFormats.Get "md" }}<a href="{{ .RelPermalink }}" download>↓ Download Markdown</a>{{ end }}
  </div>
  <h1 class="text-4xl sm:text-5xl">{{ .Title }}</h1>
  {{ with .Site.Params.tagline }}<blockquote class="my-8">{{ . }}</blockquote>{{ end }}
  <div class="prose-editorial">{{ .Content }}</div>
</article>
{{ end }}
