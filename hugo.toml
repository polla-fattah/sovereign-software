baseURL = "https://polla-fattah.github.io/sovereign-software/"
locale = "en-us"
title = "Sovereign Personal Software — Manifesto, Index & Engineering Standard"
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = true

[params]
  specVersion = "v2.4 (CANONICAL)"
  quote = "Your data belongs to you. Your tools should respect your time, preserve your freedom, and remain useful without depending on someone else’s infrastructure."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params.social]
  # Set this to your repository URL, e.g. https://github.com/<user>/<repo>
  githubRepo = "https://github.com/polla-fattah/sovereign-software"


[outputFormats.md]
  mediaType = "text/markdown"
  baseName = "sovereign-personal-software-manifesto"
  isPlainText = true
  notAlternative = true

[mediaTypes."text/markdown"]
  suffixes = ["md"]
