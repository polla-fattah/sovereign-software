baseURL = "https://sovereign.polla.dev/"
locale = "en-us"
title = "Sovereign Personal Software: Manifesto and Evaluation Framework"
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = true

[params]
  tagline = "Software should serve people without claiming permanent custody over their information, choices, or work."
  description = "Software should remain under human authority, preserve human knowledge, function independently wherever possible, and make consequential behavior understandable and controllable."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params.social]
  # Set this to your repository URL, e.g. https://github.com/<user>/<repo>
  githubRepo = "https://github.com/polla-fattah/sovereign-software"


[outputFormats.md]
  mediaType = "text/markdown"
  baseName = "sovereign-personal-software-manifesto"
  isPlainText = true
  notAlternative = true

[mediaTypes."text/markdown"]
  suffixes = ["md"]
